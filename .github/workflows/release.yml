name: Release

# A pushed vX.Y.Z tag publishes a release: the Firefox build goes to
# addons.mozilla.org for review, a GitHub release carries the unpacked Chrome
# zip and the notes from CHANGELOG.md, and the Chrome Web Store build is
# uploaded for review once that listing exists.
# Pull requests that touch the build, and runs started by hand, build the same
# files without publishing.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - scripts/**
      - CHANGELOG.md
      - src/manifest.json
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Work out the version
        id: version
        run: |
          version="$(node -p 'require("./src/manifest.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write the notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A tag must have its notes; a test build of an unreleased version has none.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/release-notes.sh "$VERSION" > dist-notes.md
          else
            scripts/release-notes.sh "$VERSION" > dist-notes.md 2>/dev/null || echo "Test build." > dist-notes.md
          fi

      # The Chrome Web Store assigns its own item ID, so its build uses the
      # OAuth client made for that ID once there is one.
      - name: Build
        env:
          IG_PLUS_CHROME_CLIENT_ID: ${{ secrets.IG_PLUS_CHROME_CLIENT_ID }}
        run: |
          npm run build
          mv dist-notes.md dist/notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/notes.md
            dist/*.zip
          if-no-files-found: error

  # Submits the version for Mozilla's review; AMO lists and serves it once
  # approved, so this does not wait for a signed file.
  firefox:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Sign
        env:
          VERSION: ${{ needs.build.outputs.version }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir firefox
          unzip -q "dist/ig-plus-firefox-$VERSION.zip" -d firefox
          # Listed versions must name a license; amo-metadata.json gives it.
          npx web-ext sign --channel=listed --approval-timeout=0 --source-dir firefox \
            --amo-metadata amo-metadata.json

  publish:
    if: github.ref_type == 'tag'
    needs: [build, firefox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Copies installed from GitHub before 1.0.4 check the latest release's
      # updates.json, which points at 1.0.4, the last version they can update to
      # before AMO takes over.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release download v1.0.4 --repo "$GITHUB_REPOSITORY" --pattern updates.json --dir dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "IG Plus $VERSION" --notes-file dist/notes.md \
            "dist/ig-plus-chrome-$VERSION.zip" dist/updates.json

  # Submits the version for review; the store publishes it once approved.
  # Secrets cannot gate a job, so each step checks for the store's item ID.
  chrome:
    if: github.ref_type == 'tag'
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - name: Skip until the store listing exists
        if: env.EXTENSION_ID == ''
        run: echo "::notice::CWS_EXTENSION_ID is not set, so the Chrome Web Store is skipped."

      - if: env.EXTENSION_ID != ''
        uses: actions/checkout@v7

      - if: env.EXTENSION_ID != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: env.EXTENSION_ID != ''
        run: npm ci

      - if: env.EXTENSION_ID != ''
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload and publish
        if: env.EXTENSION_ID != ''
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx chrome-webstore-upload --source "dist/ig-plus-chrome-store-$VERSION.zip"
